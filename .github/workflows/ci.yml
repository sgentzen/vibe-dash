name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs when new commits are pushed to the same branch, so
# outdated runs stop consuming Actions minutes. Pushes to main (empty head_ref)
# fall back to the ref and are NOT cancelled, so every main commit runs to
# completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Lifecycle scripts are off, so a compromised transitive dependency can't
      # run arbitrary code in CI at install time. Only the two packages that
      # genuinely need one are rebuilt explicitly: better-sqlite3 (native addon)
      # and esbuild (platform binary). Those two still run their scripts — this
      # shrinks the trusted set from the whole tree to them, it doesn't empty it.
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild better-sqlite3 esbuild

      # `npm rebuild` exits 0 for a name that matches nothing, so the list above
      # would rot silently. Fail loudly if a dependency bump changes which
      # packages carry install scripts.
      - name: Check install-script allowlist
        run: npm run check:install-scripts

      # Gate on the shipped dependency tree. Dev-only advisories are excluded
      # because the ESLint toolchain currently pins a vulnerable brace-expansion
      # via minimatch@3 and no in-range fix exists — the only npm-suggested
      # remedy is downgrading the plugins. Dependabot still reports dev
      # advisories, so they stay visible without blocking every build.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Type-check
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Upload coverage (lcov)
        if: ${{ matrix.node-version == 22 && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

      - name: Build
        run: npm run build:client

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # See the test job for why lifecycle scripts are disabled here.
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild better-sqlite3 esbuild

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      # Build the client so the express server can serve the production bundle.
      # In CI, playwright.config.ts targets that single server on :3001 (no vite
      # dev server / proxy), which removes the dev-server warmup flakiness.
      - name: Build client
        run: npm run build:client

      # Playwright's webServer boots the express server (:3001) serving the
      # prebuilt SPA + API + WS. CI=true (set by GitHub) enables the 2 retries.
      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# NOTE: there is deliberately no SonarCloud job here. This project uses
# SonarCloud Automatic Analysis, which SonarSource documents as mutually
# exclusive with CI-based analysis: "If you enable automatic analysis, you must
# ensure that you do not have any CI-based analyses configured. If you do then
# these CI-based analyses will fail and cause a failure in your build process."
# A scanner job used to live here and did exactly that — it failed every run
# with "You are running CI analysis while Automatic Analysis is enabled". The
# last green run on main was 2026-07-13; every run after it was red on this job
# alone, while test, e2e, lint and typecheck all passed. Nearly four weeks of
# red CI came from one unreachable job. Analyser config is in
# .sonarcloud.properties, which is the file Automatic Analysis actually reads.
#
# The trade-off: Automatic Analysis does not support code coverage, so no lcov
# reaches SonarCloud. The test job still produces coverage and uploads it as a
# build artifact. To get coverage into SonarCloud you must switch the whole
# project back to CI analysis — re-add a scanner job here AND disable Automatic
# Analysis in the SonarCloud UI (Administration > Analysis Method). Doing only
# one of those two is what caused the original outage.
