# SonarCloud Automatic Analysis configuration.
#
# Automatic Analysis reads THIS file. It ignores sonar-project.properties,
# which is why that file was removed — it looked authoritative while having no
# effect. See the note in .github/workflows/ci.yml for why this project uses
# Automatic Analysis rather than a CI scanner job.
#
# sonar.organization / sonar.projectKey are not set here: project binding is
# configured in the SonarCloud UI, not by this file.

# Analyzed source and test roots (must not overlap)
sonar.sources=cli,mcp,server,shared,src
sonar.tests=e2e,tests

# Keep generated/vendored/doc paths out of analysis
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,docs/**,**/*.d.ts
